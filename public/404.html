<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | Legal Practice &amp; Advisory</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Inter", sans-serif;
      background-color: #f8fafc;
      color: #5A6A7E;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(12, 43, 78, 0.08), 0 8px 10px -6px rgba(12, 43, 78, 0.04);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0F766E;
      background-color: #f0fdfa;
      border: 1px solid #ccfbf1;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .code {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 64px;
      font-weight: 700;
      color: #0C2B4E;
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      color: #0C2B4E;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #5A6A7E;
      margin-bottom: 24px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #0C2B4E;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .button:hover {
      background-color: #17385c;
    }
    .button:active {
      transform: scale(0.98);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Notice</div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The legal document, section, or page you requested could not be located. It may have been moved or the address may have been entered incorrectly.</p>
    <a href="/" class="button">Return to Homepage</a>
    <div class="footer-note">Legal Practice &amp; Advisory</div>
  </div>
</body>
</html>
